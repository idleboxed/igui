[package]
name = "igui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
autotests = false
description = "Idle GUI: a game browser for desktop and Linux DRM/KMS"
license = "BSD-3-Clause"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = ["desktop", "rgb565"]
desktop = ["dep:minifb"]
drm = ["imanlib/drm"]
drm-diagnostics = ["drm", "imanlib/drm-diagnostics"]
rgb565 = ["imanlib/rgb565"]

[dependencies]
tempfile = "=3.24.0"
imanlib = { git = "https://github.com/idleboxed/imanlib.git", rev = "044a989218813a1636847289d3530e1b264513eb", features = ["input"] }
embedded-graphics = "=0.8.2"
minifb = { version = "=0.28.0", default-features = false, features = ["x11"], optional = true }
png = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }
